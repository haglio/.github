# The check this repository's merge queue requires. Every repo in the family runs the
# workflows kept here, so a typo in one breaks all of them at once; actionlint reads
# the workflow syntax, the expression language and each action's inputs, which is
# where such a typo lives. The check also waits for retry's own checks below, since
# every gate's fetches from GitHub go through it.
name: check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # On both kinds of runner the family's gates run on, from this checkout's copy of it.
  retry:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/retry

      - name: A fetch from GitHub that fails once gets through on the next try
        env:
          RETRY_PAUSE: "1"
        run: |
          set -euo pipefail
          tries="$RUNNER_TEMP/fetch-tries"
          # The first try goes to an address nothing answers, as a fetch does when GitHub drops it.
          retry bash -c '
            echo try >> "$1"
            if [ "$(wc -l < "$1")" -eq 1 ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=url.https://127.0.0.1:9/.insteadOf GIT_CONFIG_VALUE_0=https://github.com/
            fi
            git ls-remote https://github.com/haglio/.github HEAD
          ' _ "$tries"
          if [ "$(wc -l < "$tries")" -ne 2 ]; then
            echo "the fetch ran $(wc -l < "$tries") times, not twice"
            exit 1
          fi

      - name: A command that keeps failing ends the step with its own exit status after the last try
        env:
          RETRY_TRIES: "3"
          RETRY_PAUSE: "0"
        run: |
          set -euo pipefail
          tries="$RUNNER_TEMP/failing-tries"
          status=0
          retry bash -c 'echo try >> "$1"; exit 7' _ "$tries" || status=$?
          if [ "$status" -ne 7 ] || [ "$(wc -l < "$tries")" -ne 3 ]; then
            echo "retry ended with exit status $status after $(wc -l < "$tries") tries, not 7 after 3"
            exit 1
          fi

  actionlint:
    needs: retry
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/retry

      - name: Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          retry curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: retry passed its checks on both runners
        env:
          RESULT: ${{ needs.retry.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "retry's checks came to $RESULT; their own jobs name what failed"
            exit 1
          fi
