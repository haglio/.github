# Tags a landing on main that changed code an app installs, so a consumer can name the copy
# of a shared package it was built against. Called by a shared repo's own merge-gate.yml on
# `push` to main. A landing that changed only the library's tests, tools, records or the pins
# its own tests install makes no release: in the week to 2026-11-15, 68 of the 117 releases were
# such, and each set every app taking a new version and running its checks for nothing.
#
# The apps are offered the newest releases once an hour (offer-the-newest-releases.yml, on
# app_support's schedule), carrying every library's at once. A landing with an `Urgent:` trailer
# on one of its commits -- a hotfix shipping the usual way, a crash -- is offered at once.
#
# The tag IS the version: those repos read theirs with setuptools-scm, which takes it
# from `git describe`, so `pip install "<name> @ git+<repo>@<tag>"` reports that tag
# and a pin cannot disagree with what it installs. The number is the count of commits
# on main -- it needs no state anywhere, it can only go up, and nothing in a pull
# request has to remember to bump it.
name: tag the landing

on:
  workflow_call:
    inputs:
      series:
        description: The version series the commit count is appended to.
        type: string
        default: "0.1"

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TOOL: app-support @ git+https://github.com/haglio/app_support@v0.1.489
    outputs:
      urgent: ${{ steps.decide.outputs.urgent }}
    steps:
      - name: Check out the landing, with the history the count is taken from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Put retry on the PATH
        uses: haglio/.github/.github/actions/retry@main

      - name: Ask whether the landing changed code an app installs, and whether it is urgent
        id: decide
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/releases"
          retry "$RUNNER_TEMP/releases/bin/pip" install --quiet "$TOOL"
          "$RUNNER_TEMP/releases/bin/python" -m app_support.releases | tee -a "$GITHUB_OUTPUT"

      - name: Tag it
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          tag="v${{ inputs.series }}.$(git rev-list --count HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already here; nothing to do"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "::notice::tagged $tag"

  offer-at-once:
    needs: tag
    if: needs.tag.outputs.urgent == 'true'
    uses: haglio/.github/.github/workflows/offer-the-newest-releases.yml@main
    secrets: inherit
